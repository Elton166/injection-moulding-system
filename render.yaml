services:
  - type: web
    name: injection-moulding-system
    runtime: python
    buildCommand: "pip install -r requirements-pythonanywhere.txt && python manage.py migrate && python manage.py collectstatic --no-input && python setup_troubleshooting.py && python setup_issues.py"
    startCommand: "gunicorn injection_moulding.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
